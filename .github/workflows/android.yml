name: Android APK

on:
  push:
    branches: ['claude/sillytavern-extensions-mtpxm8', 'main']
    paths:
      - 'android/**'
      - 'server/**'
      - 'src/**'
      - 'index.js'
      - 'style.css'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      st_ref:
        description: 'SillyTavern branch or tag to bundle'
        required: false
        default: 'release'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ST_REF: ${{ github.event.inputs.st_ref || 'release' }}
      STORE_FILE: ${{ github.workspace }}/android/keystore.jks
      KEY_ALIAS: tavern
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q zip imagemagick

      - name: Node.js for Android (Termux packages)
        run: |
          python3 android/scripts/fetch_termux_node.py --abi arm64-v8a --out android/build-inputs
          python3 android/scripts/fetch_termux_node.py --abi x86_64 --out android/build-inputs

      - name: SillyTavern bundle
        run: bash android/scripts/prepare_st.sh android/build-inputs/assets/st.zip "$ST_REF"

      # The signing key must stay the same between builds, otherwise Android refuses to update the
      # app and it has to be reinstalled (losing chats). It is kept in the repository's private
      # Actions cache (refreshed weekly by keep-signing-key.yml) or supplied as a secret.
      - name: Restore signing key
        uses: actions/cache/restore@v4
        with:
          path: android/keystore.jks
          key: apk-signing-key-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          SECRET_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$STORE_FILE"
            echo "STORE_PASSWORD=$SECRET_PASSWORD" >> "$GITHUB_ENV"
            echo "Using the signing key from repository secrets"
          else
            echo "STORE_PASSWORD=tavern-apk-key" >> "$GITHUB_ENV"
            if [ ! -f "$STORE_FILE" ]; then
              keytool -genkeypair -keystore "$STORE_FILE" -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 \
                -validity 36500 -storepass tavern-apk-key -keypass tavern-apk-key \
                -dname "CN=SillyTavern Android (unofficial)"
              echo "NEW_KEY=1" >> "$GITHUB_ENV"
              echo "Generated a new signing key"
            else
              echo "Using the cached signing key"
            fi
          fi

      - name: Save new signing key
        if: env.NEW_KEY == '1'
        uses: actions/cache/save@v4
        with:
          path: android/keystore.jks
          key: apk-signing-key-v1

      - name: Build APKs
        run: gradle -p android assembleRelease --no-daemon --stacktrace -PversionCode=${{ github.run_number }} -PstVersion="$ST_VERSION"

      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*arm64-v8a*.apk "out/SillyTavern-${ST_VERSION}-build${{ github.run_number }}-arm64.apk"
          cp android/app/build/outputs/apk/release/*x86_64*.apk "out/SillyTavern-${ST_VERSION}-build${{ github.run_number }}-x86_64.apk"
          ls -la out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash android/ci/emulator-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk-build-${{ github.run_number }}
          path: |
            out/*.apk
            *.png
          if-no-files-found: ignore

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: SillyTavern for Android — ${{ env.ST_VERSION }} (build ${{ github.run_number }})
          prerelease: true
          files: out/*.apk
          body: |
            Unofficial Android build of SillyTavern ${{ env.ST_VERSION }} with the Extensionz suite.

            * Phones: install **SillyTavern-…-arm64.apk**.
            * x86_64 is for emulators and a few Chromebooks.

            The first start unpacks SillyTavern and builds its interface once (about a minute on a phone).
            Your data lives inside the app; the SillyTavern folder is visible in the system "Files" app.
